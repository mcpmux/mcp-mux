[package]
name = "mcpmux-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared bootstrap used by the McpMux desktop app and the headless mcpmuxd daemon"

[dependencies]
# Internal crates
mcpmux-core.workspace = true
mcpmux-gateway.workspace = true
mcpmux-storage.workspace = true

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Utilities
uuid.workspace = true
chrono.workspace = true
zeroize.workspace = true
dirs.workspace = true

# Cross-platform file locking (flock on Unix, LockFileEx on Windows)
fs2 = "0.4"

# HTTP for the post-spawn /health probe
reqwest = { workspace = true, features = ["json", "rustls"] }
url.workspace = true

[dev-dependencies]
tempfile = "3.14"
tokio = { workspace = true, features = ["test-util", "macros"] }